name: Supabase keep-alive

# The Supabase free tier auto-pauses a project after ~7 days without activity, which
# takes the lead dashboard and the public consultation form down together. This pings
# /api/health daily so the project always counts as active, and fails loudly if the
# database is already unreachable.
#
# This duplicates the Vercel cron in vercel.json on purpose: the two fail independently,
# and GitHub disables scheduled workflows after 60 days of repository inactivity.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          auth=()
          if [ -n "$CRON_SECRET" ]; then
            auth=(-H "Authorization: Bearer $CRON_SECRET")
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 30 --max-time 30 \
            "${auth[@]}" \
            https://www.kirafaraid.my/api/health)
          echo "HTTP $status"
          cat response.json
          test "$status" = "200"
